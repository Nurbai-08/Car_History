services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: carhistory
      POSTGRES_USER: carhistory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ['127.0.0.1:55432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carhistory']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    build: {context: ., dockerfile: docker/minio.Dockerfile}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-local-carhistory}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-local-development-only}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
  bucket:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    depends_on:
      minio: {condition: service_healthy}
    environment:
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_PATH_STYLE: 'true'
      STORAGE_BUCKET: carhistory
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-local-carhistory}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-local-development-only}
    command: ['node', 'apps/api/dist/init-storage.js']
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  api:
    profiles: ['app']
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://carhistory:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/carhistory
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      bucket: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    profiles: ['app']
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://carhistory:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/carhistory
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      bucket: { condition: service_completed_successfully }
  web:
    profiles: ['app']
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ['127.0.0.1:8080:80']
    depends_on: [api]
volumes:
  postgres-data:
  redis-data:
  minio-data:

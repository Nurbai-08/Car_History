server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16m;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  location /api/ { proxy_pass http://api:3001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /r/ { add_header X-Robots-Tag "noindex, nofollow" always; add_header Referrer-Policy no-referrer always; try_files $uri /index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
